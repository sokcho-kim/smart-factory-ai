version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: punchline
      POSTGRES_USER: punchline
      POSTGRES_PASSWORD: punchline123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/platform/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  ai:
    build:
      context: .
      dockerfile: src/ai/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://punchline:punchline123@db:5432/punchline
    depends_on:
      - db

  dashboard:
    build:
      context: ./src/platform/dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AI_API_URL: http://ai:8000
    depends_on:
      - ai

volumes:
  pgdata:
